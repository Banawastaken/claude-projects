# Daily data collection.
#
# This used to be two scheduled Claude Routines. They fire reliably and every
# run is recorded as succeeded, but across a week not one of them ever landed a
# commit -- including after the scripts were rewritten to commit a log line on
# every code path, failures included. The runs are not observable from the
# session that created them, so the cause could not be pinned down.
#
# Actions removes the question. It runs on GitHub's own infrastructure, writes
# with the repository's own token, and every run leaves a log anyone can read.
name: collect

on:
  schedule:
    # Dealer gamma, 22:05 UTC on weekdays: after the US close, while the CBOE
    # delayed chain still reports the session that just settled.
    - cron: '5 22 * * 1-5'
    # Earnings consensus, 06:00 UTC daily: Alpha Vantage's free tier resets on
    # a daily quota, so a name refused yesterday is retried today.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which collector to run'
        required: true
        default: both
        type: choice
        options: [both, gex, pead]

permissions:
  contents: write

concurrency:
  # Two collectors committing to one branch would race on the push.
  group: collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/prop-firm-strategies-bvor8w
          # The collectors pull and push, so they need real history, not the
          # single commit a shallow clone would give them.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --quiet numpy pandas

      - name: Record dealer gamma
        if: |
          github.event.schedule == '5 22 * * 1-5' ||
          contains(fromJSON('["both","gex"]'), inputs.job)
        run: bash bin/record_gex.sh

      - name: Fill the earnings basket
        if: |
          github.event.schedule == '0 6 * * *' ||
          contains(fromJSON('["both","pead"]'), inputs.job)
        env:
          # Required. src/av_earnings.py has no fallback -- it exits rather
          # than fetch without a key, so that a missing secret fails loudly
          # here instead of looking like an empty day's quota.
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: |
          if [ -z "${ALPHAVANTAGE_KEY:-}" ]; then
            echo "::error::ALPHAVANTAGE_KEY is not set. Add it under" \
                 "Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          bash bin/fill_pead.sh
